[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-daily"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "plotly>=6.0.0",
    "polars",
    "pyarrow>=23.0.1",
    "fastparquet>=2026.3.0",
    "joblib>=1.5.3",
    "numba>=0.65.0",
]

[project.scripts]
legacy-arb-backtest = "examples.legacy.arb.main:main"
foundation-taker-demo = "examples.foundation_taker.demo:main"

[tool.setuptools.packages.find]
include = ["examples*", "public_tools*", "ParamsSearch*", "TestScripts*"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv.pip]
index-url = "https://mirrors.aliyun.com/pypi/simple"
